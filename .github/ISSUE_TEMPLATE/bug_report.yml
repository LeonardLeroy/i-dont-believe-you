name: Bug report
description: Something behaves differently from what is documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and its output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Transcript and diff
      description: >
        The smallest transcript and `git diff` that reproduce it. If you can, add them as an eval
        case under `evals/cases/` in a PR instead. That is the fastest path to a fix.
      render: diff

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npx i-dont-believe-you --version`
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Node version and OS
      placeholder: node 22.11 on Windows 11
    validations:
      required: true
